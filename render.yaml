services:
  - type: web
    name: researchforge-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEMO_WORKSPACE
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_CHECK_REVOKED
        value: "false"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: "8000"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SQL_HOST
        sync: false
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: SQL_DB_NAME
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: researchforge-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: researchforge-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: researchforge-redis
          property: connectionString

  - type: worker
    name: researchforge-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    plan: starter
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEMO_WORKSPACE
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_CHECK_REVOKED
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SQL_HOST
        sync: false
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: SQL_DB_NAME
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: researchforge-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: researchforge-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: researchforge-redis
          property: connectionString

  - type: redis
    name: researchforge-redis
    region: singapore
    plan: free
    ipAllowList: []
