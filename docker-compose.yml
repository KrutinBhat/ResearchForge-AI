services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researchforge
      POSTGRES_PASSWORD: researchforge_dev_password
      POSTGRES_DB: researchforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: researchforge-ai-api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SQL_HOST: postgres
      SQL_USER: researchforge
      SQL_PASSWORD: researchforge_dev_password
      SQL_DB_NAME: researchforge

  api:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      ENVIRONMENT: development
      ENABLE_DEMO_WORKSPACE: "true"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_CHECK_REVOKED: ${FIREBASE_CHECK_REVOKED:-false}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      SQL_HOST: postgres
      SQL_USER: researchforge
      SQL_PASSWORD: researchforge_dev_password
      SQL_DB_NAME: researchforge
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-before-staging-or-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

  worker:
    image: researchforge-ai-api
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; from app.worker import check_redis_health; sys.exit(0 if check_redis_health() else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
    environment:
      ENVIRONMENT: development
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_CHECK_REVOKED: ${FIREBASE_CHECK_REVOKED:-false}
      SQL_HOST: postgres
      SQL_USER: researchforge
      SQL_PASSWORD: researchforge_dev_password
      SQL_DB_NAME: researchforge
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-before-staging-or-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

volumes:
  pgdata:
