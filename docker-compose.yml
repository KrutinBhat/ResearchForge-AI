services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researchforge
      POSTGRES_PASSWORD: researchforge_dev_password
      POSTGRES_DB: researchforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      ENABLE_DEMO_WORKSPACE: "true"
      SQL_HOST: postgres
      SQL_USER: researchforge
      SQL_PASSWORD: researchforge_dev_password
      SQL_DB_NAME: researchforge
      JWT_SECRET: ${JWT_SECRET:-replace-with-strong-random-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SQL_HOST: postgres
      SQL_USER: researchforge
      SQL_PASSWORD: researchforge_dev_password
      SQL_DB_NAME: researchforge
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

volumes:
  pgdata:
